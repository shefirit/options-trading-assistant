# ============================================================
#  Your strategies - the single source of truth for the rules.
#  This mirrors your Notion SOP. When a rule changes (say you
#  tighten the short-leg delta to 0.08), change it HERE only.
#  The scanner and the checklist both read from this file.
#
#  Field guide (plain English):
#    short_leg_delta_max : biggest delta allowed on the option you SELL
#                          (delta is roughly the chance it finishes in the money)
#    dte_target/min/max  : days to expiration you want at entry
#    profit_target_pct   : close when you have kept this % of the credit
#    stop_loss_multiple  : close if the loss reaches this many times the credit
#    time_exit_dte       : close no matter what once this many days are left
#    short_call_delta     : the delta you sell covered calls at
#  Notes:
#    "long"  leg  = the option you BUY  (shows as +qty in thinkorswim)
#    "short" leg  = the option you SELL (shows as -qty in thinkorswim)
# ============================================================

strategies:

  # ---------------- CREDIT SPREADS ----------------
  put_credit_spread:
    name: "Put Credit Spread (Bull Put Spread)"
    family: credit_spread
    market_outlook: "Neutral / Bullish"
    difficulty: "Beginner"
    underlying_style: european_or_us   # SOP: any liquid stock, ETF, or index. SPX (European) = cash-settled, no assignment; stocks/ETFs can be assigned.
    plain_english: "You SELL a put below the current price and BUY a cheaper put further below as protection. You collect cash (a credit) and win as long as price stays above your short put."
    tos_hint: "Short put shows as -1, long put shows as +1. Net credit shows in green."
    notion_url: "https://app.notion.com/p/38803e90e03281199d80d4c1fbc5056d"
    legs:
      - role: short_put
        action: sell
        option_type: put
      - role: long_put
        action: buy
        option_type: put
    entry:
      short_leg_delta_max: 0.25   # SOP: short put delta 0.25 max (lower = safer)
      min_credit_pct_of_width: 0.06   # SOP: credit must be >= 6% of the spread width
      dte_target: 45              # SOP: 45 DTE preferred
      dte_min: 21                 # European indices may enter at 21
      dte_max: 45
      dte_min_us_style: 30        # SOP: stocks/ETFs avoid the ~21-DTE early-assignment zone
      dte_max_us_style: 49        # but still catch the real ~monthly expiration (chains cluster near 34/48)
    exit:
      profit_target_pct: 50
      stop_loss_multiple: 2.0
      time_exit_dte: 21
    sizing:
      max_loss_basis: vertical_width   # (width - credit) * 100 * contracts

  call_credit_spread:
    name: "Call Credit Spread (Bear Call Spread)"
    family: credit_spread
    market_outlook: "Neutral / Bearish"
    difficulty: "Beginner"
    underlying_style: european_or_us   # SOP: any liquid stock, ETF, or index. SPX (European) = cash-settled, no assignment; stocks/ETFs can be assigned.
    plain_english: "You SELL a call above the current price and BUY a cheaper call further above as protection. You collect cash and win as long as price stays below your short call."
    tos_hint: "Short call shows as -1, long call shows as +1. Net credit shows in green."
    notion_url: "https://app.notion.com/p/38803e90e032814ebbfce1dc07dfdfac"
    legs:
      - role: short_call
        action: sell
        option_type: call
      - role: long_call
        action: buy
        option_type: call
    entry:
      short_leg_delta_max: 0.10   # SOP: short call delta 0.10 and below (stricter than puts)
      min_credit_pct_of_width: 0.06   # SOP: credit must be >= 6% of the spread width
      dte_target: 45              # SOP: ~45 DTE
      dte_min: 21                 # European indices may enter at 21
      dte_max: 45
      dte_min_us_style: 30        # SOP: stocks/ETFs avoid the ~21-DTE early-assignment zone
      dte_max_us_style: 49        # but still catch the real ~monthly expiration (chains cluster near 34/48)
    exit:
      profit_target_pct: 50
      stop_loss_multiple: 2.0
      time_exit_dte: 21
    sizing:
      max_loss_basis: vertical_width

  iron_condor:
    name: "Iron Condor"
    family: credit_spread
    market_outlook: "Neutral (no big moves)"
    difficulty: "Intermediate"
    underlying_style: european_or_us   # SOP: any liquid stock, ETF, or index. European (SPX/NDX) can enter 21-45; US-style must enter at ~45 (no early-assignment surprises).
    plain_english: "A put credit spread AND a call credit spread at the same time. You collect cash from both sides and win if price stays inside your range."
    tos_hint: "Four legs: -1 short put, +1 long put, -1 short call, +1 long call. One net credit."
    notion_url: "https://app.notion.com/p/38803e90e03281498abfd46c0efe70db"
    legs:
      - role: long_put
        action: buy
        option_type: put
      - role: short_put
        action: sell
        option_type: put
      - role: short_call
        action: sell
        option_type: call
      - role: long_call
        action: buy
        option_type: call
    entry:
      short_leg_delta_max: 0.15   # SOP: 0.15 max PER LEG (total ~0.30 = 70% win)
      # SOP: net credit must be >= 6% of ONE wing's width - the wider wing, which
      # is the side that can actually lose (same side sizing.py uses for max loss).
      min_credit_pct_of_width: 0.06
      dte_target: 45              # SOP: 45 DTE preferred
      dte_min: 21                 # European indices may enter at 21
      dte_max: 45
      dte_min_us_style: 30        # SOP: stocks/ETFs avoid the ~21-DTE early-assignment zone
      dte_max_us_style: 49        # but still catch the real ~monthly expiration
    exit:
      profit_target_pct: 50
      stop_loss_multiple: 2.0
      time_exit_dte: 21
    sizing:
      max_loss_basis: vertical_width   # widest single side - condor risk is one side at a time

  # ---------------- CASH SECURED PUT ----------------
  cash_secured_put:
    name: "Cash Secured Put (CSP)"
    family: single_leg
    market_outlook: "Neutral / Bullish"
    difficulty: "Beginner"
    underlying_style: us
    plain_english: "You SELL a put and set aside the cash to buy 100 shares if assigned. You get paid to agree to buy the stock at a discount."
    tos_hint: "Short put shows as -1. Cash needed = strike x 100 per contract."
    notion_url: "https://app.notion.com/p/38803e90e0328119965ef6c5189e060b"
    legs:
      - role: short_put
        action: sell
        option_type: put
    entry:
      short_leg_delta_max: 0.30   # CSPs are commonly sold nearer 0.30 to actually get assigned the shares
      dte_target: 30
      dte_min: 21
      dte_max: 44
    exit:
      profit_target_pct: 50
      stop_loss_multiple: 2.0
      time_exit_dte: 21
    sizing:
      max_loss_basis: cash_secured   # strike * 100 * contracts (minus credit)

  # ---------------- THE WHEEL ----------------
  # Phase 1 of the Wheel is structurally a cash secured put, so it scans the same
  # way. What makes it a different TRADE is the exit block: Rita's ruling
  # (2026-08-03) is that a Wheel put has NO stop loss and NO 21-day time exit,
  # because both of those close the put before it can be assigned - and
  # assignment is the doorway to Phase 2, not a failure. Risk control here is
  # stock selection and position size, not a stop.
  wheel:
    name: "The Wheel (CSP into Covered Call)"
    family: single_leg
    market_outlook: "Neutral / Bullish"
    difficulty: "Beginner"
    underlying_style: us
    plain_english: "You SELL a put on a stock you want to own. If it expires worthless you keep the cash and sell another. If you are assigned, you own 100 shares and start selling covered calls against them - around and around."
    tos_hint: "Short put shows as -1. Cash needed = strike x 100 per contract. If assigned, the shares appear and you sell calls against them."
    notion_url: "https://app.notion.com/p/3b103e90e03281f49c94ca1fffc6784f"
    legs:
      - role: short_put
        action: sell
        option_type: put
    entry:
      short_leg_delta_max: 0.30   # SOP says 0.20-0.30; 0.30 is the ceiling
      dte_target: 35
      dte_min: 30
      dte_max: 45
    exit:
      profit_target_pct: 50
      accepts_assignment: true    # no stop_loss_multiple, no time_exit_dte - deliberate
    sizing:
      max_loss_basis: cash_secured   # strike * 100 * contracts (minus credit)

  # ---------------- LEAPS LONG CALL ----------------
  # The ONLY strategy in this book that is a pure directional BET. Every other
  # one sells premium and wins on time; this one BUYS premium and needs the
  # stock to actually move. Time is the enemy here, not the ally.
  #
  # Not to be confused with the PMCC, which also buys a LEAPS. Different job:
  #   PMCC        - the LEAPS is a STOCK SUBSTITUTE you rent out by selling
  #                 calls against it. Held long-term, wanted cheap, delta 0.80+.
  #   This        - the LEAPS is the whole trade. Bought on a dip, sold for a
  #                 20-50% gain in weeks or months. Delta 0.70-0.80.
  # Their entry rules differ on purpose. Do not copy one into the other.
  long_call_leaps:
    name: "LEAPS Call (Long Call)"
    family: long_call
    market_outlook: "Bullish"
    difficulty: "Intermediate"
    underlying_style: us
    plain_english: "You BUY a call option a year or more out on a quality stock that has pulled back with the market. It costs a fraction of what 100 shares would, your loss can never exceed what you paid, and your upside is uncapped. The catch is that you are paying for time - if the stock goes nowhere, you lose money that owning the shares would not have cost you."
    stock_criteria:
      - "Chart trending UP over the past year and a half, recovering from every dip"
      - "PE ratio positive - the company actually earns a profit"
      - "If PE is over 100, it should hold enough cash to cover its debts at least once"
      - "LEAPS open interest of 250+ contracts, so you can get out easily"
      - "The pullback must be the MARKET falling, never bad earnings or bad guidance"
    tos_hint: "Long call shows as +1 (far expiration). This is a DEBIT - money leaves your account when you open it."
    notion_url: "https://app.notion.com/p/3b503e90e03281a699eec79a1b2ae123"
    legs:
      - role: long_call_leaps
        action: buy
        option_type: call
    entry:
      long_leg_delta_min: 0.70    # 70 delta or DEEPER. Never out of the money.
      long_leg_delta_target: 0.72
      dte_min: 365                # a LEAP is 365+ days by definition
      dte_max: 800                # roughly the furthest LEAPS actually listed
      dte_target: 400             # 400+ preferred: room to be wrong through a crash
      min_open_interest: 250      # thin LEAPS cost more to get out of than they pay
      # Entry TIMING. Buy fear, not comfort - all of these point the same way.
      vix_min: 15.0               # below 15 the market is greedy and a shock is due
      bollinger_band_max: 0.50    # 0 = lower band, 1 = upper. Lower half only.
      rsi_max: 45                 # heading toward oversold (30), not bouncing off 70
    exit:
      # Two windows, both "take it and look for the next one". There is no
      # profit target beyond these on purpose: the whole lesson is that a LEAPS
      # up big and fast is hugging the upper band and tends to revert.
      fast_profit_pct: 10         # 10-20% inside a week -> close
      fast_profit_days: 7
      quick_profit_pct: 20        # 20-40% inside four weeks -> close
      quick_profit_days: 28
      roll_forward_dte: 180       # under 6 months theta bites; roll or close
      # NO STOP LOSS, deliberately. Risk is controlled at entry by SIZE (10% of
      # the account across at most 3 names) and by TIME (400+ days), not by a
      # stop. A long call gaps straight through stops anyway, and cutting at a
      # fixed loss guarantees you miss the recovery the extra time was bought
      # for. This demands real tolerance - see the SOP page.
    sizing:
      max_loss_basis: long_premium   # the debit paid, full stop - it can go to zero
      max_pct_of_account: 10         # ALL open LEAPS together, not per trade
      target_positions: 3            # spread that 10% across about 3 names

  # ---------------- POOR MAN'S COVERED CALL ----------------
  poor_mans_covered_call:
    name: "Poor Man's Covered Call (PMCC)"
    family: diagonal
    market_outlook: "Neutral / Bullish"
    difficulty: "Intermediate"
    underlying_style: us
    plain_english: "Instead of buying 100 shares, you BUY a deep long-dated call (LEAPS) as a stock substitute, then SELL short-dated calls against it for income."
    tos_hint: "Long LEAPS call shows as +1 (far expiration), short call shows as -1 (near expiration)."
    notion_url: "https://app.notion.com/p/38803e90e0328176a77cc474cbe78f2a"
    legs:
      - role: long_call_leaps
        action: buy
        option_type: call
      - role: short_call
        action: sell
        option_type: call
    entry:
      long_leg_delta_min: 0.80    # deep in the money LEAPS acts like the stock
      short_call_delta: 0.30      # sell the short call at delta 0.30
      short_call_dte_target: 30
      leaps_dte_min: 180          # long call should be far out (6+ months)
    exit:
      profit_target_pct: 50       # applies to the short call
      time_exit_dte: 21           # for the short call
    sizing:
      max_loss_basis: debit       # cost of LEAPS minus credit collected

  # ---------------- COVERED CALLS (own 100 real shares) ----------------
  covered_call_model_1:
    name: "Covered Call - Model 1: Absolute Protection (Collar)"
    family: covered_call
    market_outlook: "Neutral / Slightly Bearish"
    difficulty: "Beginner"
    underlying_style: us
    plain_english: "Own 100 shares, BUY a long-dated put for full downside protection, and SELL a monthly call for income. Safest model - you sleep well."
    tos_hint: "You own 100 shares (+100), long put +1, short call -1."
    notion_url: "https://app.notion.com/p/38803e90e0328188a612f56ba6d3d0f8"
    requires_shares: true
    legs:
      - role: long_put_protection
        action: buy
        option_type: put
      - role: short_call
        action: sell
        option_type: call
    entry:
      short_call_delta: 0.30
      # Rita's call (2026-07-26): sell the covered call 30-45 days out, not 21.
      # A 21-day call is the same day as the time exit below, so it would be
      # written and immediately due. The target is the middle of her window;
      # min/max bound both the Picks candidates and the Find a trade scan.
      short_call_dte_target: 37
      short_call_dte_min: 30
      short_call_dte_max: 45
      protection: "Buy a 2-year ATM put (~$3,000). Sell it after 1 year (~$1,200-$1,700 left) and buy a fresh 2-year put. Net cost ~$1,500/year."
    exit:
      profit_target_pct: 50       # for the short call
      time_exit_dte: 21
    sizing:
      max_loss_basis: shares_plus_protection

  covered_call_model_2:
    name: "Covered Call - Model 2: Classic Spread"
    family: covered_call
    market_outlook: "Neutral"
    difficulty: "Beginner"
    underlying_style: us
    plain_english: "Own 100 shares, protect with a put spread (cheaper than a full put) instead of a single put, and SELL a monthly call for income. Balanced cost and protection."
    tos_hint: "You own 100 shares (+100), a put spread for protection, short call -1."
    notion_url: "https://app.notion.com/p/38803e90e03281929691e2dba36d2791"
    requires_shares: true
    legs:
      - role: long_put_protection
        action: buy
        option_type: put
      - role: short_put_offset
        action: sell
        option_type: put
      - role: short_call
        action: sell
        option_type: call
    entry:
      short_call_delta: 0.30
      # Rita's call (2026-07-26): sell the covered call 30-45 days out, not 21.
      # A 21-day call is the same day as the time exit below, so it would be
      # written and immediately due. The target is the middle of her window;
      # min/max bound both the Picks candidates and the Find a trade scan.
      short_call_dte_target: 37
      short_call_dte_min: 30
      short_call_dte_max: 45
    exit:
      profit_target_pct: 50
      time_exit_dte: 21
    sizing:
      max_loss_basis: shares_plus_protection

  covered_call_model_3:
    name: "Covered Call - Model 3: Zero Cost Ratio"
    family: covered_call
    market_outlook: "Neutral / Bullish"
    difficulty: "Intermediate (advanced - active daily management)"
    underlying_style: us
    plain_english: "Own 100 shares, BUY 1 put and SELL 2 puts below it so protection costs about nothing, and SELL a monthly call. WARNING: below the two short puts, losses accelerate fast."
    tos_hint: "You own 100 shares (+100), long put +1, two short puts -2, short call -1."
    notion_url: "https://app.notion.com/p/38803e90e032819c8a9fc1c868fbb43f"
    requires_shares: true
    warning: "Advanced only. Below the two short put strikes, losses accelerate rapidly. Requires active daily management - not for beginners."
    legs:
      - role: long_put_protection
        action: buy
        option_type: put
      - role: short_put_ratio
        action: sell
        option_type: put
        quantity: 2
      - role: short_call
        action: sell
        option_type: call
    entry:
      short_call_delta: 0.30
      # Rita's call (2026-07-26): sell the covered call 30-45 days out, not 21.
      # A 21-day call is the same day as the time exit below, so it would be
      # written and immediately due. The target is the middle of her window;
      # min/max bound both the Picks candidates and the Find a trade scan.
      short_call_dte_target: 37
      short_call_dte_min: 30
      short_call_dte_max: 45
    exit:
      profit_target_pct: 50
      time_exit_dte: 21
    sizing:
      max_loss_basis: ratio_risk
